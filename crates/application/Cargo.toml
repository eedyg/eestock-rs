# 08-backtest / Phase 3b — 应用层回测服务（BacktestService）。
# 定位：异步任务队列 + 真实进度上报；依赖注入 domain 端口（BacktestBarRead/BacktestRunStore/BacktestProgressSink）
# + backtest crate（纯逻辑引擎）；不依赖 web/storage（DI 由 app bin / 阶段 3c 装配）。
# ADR-007：本 crate 为**手写**新 crate（非 tangle 生成）。
[package]
name = "application"
description = "应用层：回测 BacktestService（任务队列/调度、进度上报、端口注入；不依赖 web/storage）"
version.workspace = true
edition.workspace = true

[dependencies]
domain = { path = "../domain" }
backtest = { path = "../backtest" }
simlive = { path = "../simlive" }
# 12-strategy-system / P2a：StrategyService（Registry CRUD/发布门禁/在线试算/参考插件播种）。
# strategy-runtime/strategy-core 为 workspace 内 Domain 层 crate（非外部依赖）；
# sha2 为架构裁决 2026-09-09 批准的外部依赖（发布版本 sha256 寻址，ABI G4）。
strategy-runtime = { path = "../strategy-runtime" }
strategy-core = { path = "../strategy-core" }
sha2.workspace = true
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
