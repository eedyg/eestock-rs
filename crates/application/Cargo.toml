# 应用层服务 crate（手写，非 tangle；ADR-007）。
# 定位：StrategyService（12-strategy-system P2a Registry CRUD/发布门禁/在线试算）/
# WorkbenchService（P3a 回测工作台，任务制 ensemble 引擎）/ SimLiveService（11-sim-live 模拟实盘）等；
# 依赖注入 domain 端口 + backtest/strategy-core/simlive 纯逻辑 crate；不依赖 web/storage（DI 由 app bin 装配）。
# P4b（D16 终章）：旧 BacktestService（异步任务队列 + 进度上报）及 BacktestRunStore/BacktestProgressSink
# 端口已退役删除（design/12-strategy-system/01-adr.md §13.8）。
[package]
name = "application"
description = "应用层：StrategyService / WorkbenchService / SimLiveService 等（任务队列/调度、端口注入；不依赖 web/storage）"
version.workspace = true
edition.workspace = true

[dependencies]
domain = { path = "../domain" }
backtest = { path = "../backtest" }
simlive = { path = "../simlive" }
# 12-strategy-system / P2a：StrategyService（Registry CRUD/发布门禁/在线试算/参考插件播种）。
# strategy-runtime/strategy-core 为 workspace 内 Domain 层 crate（非外部依赖）；
# sha2 为架构裁决 2026-09-09 批准的外部依赖（发布版本 sha256 寻址，ABI G4）。
strategy-runtime = { path = "../strategy-runtime" }
strategy-core = { path = "../strategy-core" }
sha2.workspace = true
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
