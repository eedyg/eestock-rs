<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>P3-D-2 自测 · 真身 klinecharts 10.0.3 + 真 ChartSyncGroup（索引定位 + 有界闭环校正）</title>
<style>
  html, body { margin: 0; background:#101418; color:#c9d1d9; font:12px/1.4 monospace; }
  .pane { width: 520px; height: 240px; }
  #log { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="log"></pre>
<script src="./klinecharts.min.js"></script>
<script type="module">
import { ChartSyncGroup } from './chartSyncGroup.mjs';

const kc = window.klinecharts;
const R = { version: (kc.version || (kc.default && kc.default.version) || 'unknown'), errors: [], scenarios: {} };
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms || 100));
const err = (e) => R.errors.push(String(e && e.message ? e.message : e));

const MIN = 60000, DAY = 86400000, WEEK = 7 * DAY;
const T0 = Date.UTC(2026, 8, 14, 7, 0, 0);
function series(count, stepMs, endTs) {
  const out = []; let px = 8.9;
  for (let i = 0; i < count; i++) { px += Math.sin(i / 13) * 0.002; const ts = endTs - (count - 1 - i) * stepMs;
    out.push({ timestamp: ts, open: +px.toFixed(4), high: +(px + .001).toFixed(4), low: +(px - .001).toFixed(4), close: +(px + .0005).toFixed(4), volume: 100 }); }
  return out;
}
let paneN = 0;
function pane() { const d = document.createElement('div'); d.className = 'pane'; d.id = 'p' + (paneN++); document.getElementById('stage').appendChild(d); return d; }
function mkChart(bars, opts, period) {
  const el = pane();
  const chart = kc.init(el, Object.assign({ styles: 'dark' }, opts || {}));
  chart.setSymbol({ ticker: '518880', pricePrecision: 3, volumePrecision: 0 });
  chart.setPeriod(period);
  chart.setDataLoader({ getBars: (a) => a.callback(bars.slice(), false), subscribe: () => {}, unsubscribe: () => {} });
  chart.resetData();
  return chart;
}
const WIDENED = { layout: { barSpaceLimit: { min: 1, max: 350 } } };
function bsOf(c) { try { return c.getBarSpace().bar; } catch (e) { err(e); return null; } }
function rangeOf(c) {
  try { const r = c.getVisibleRange(); const list = c.getDataList();
    if (!isFinite(r.from) || !isFinite(r.to) || !isFinite(r.realFrom) || !isFinite(r.realTo)) return { nan: true, raw: [r.from, r.to, r.realFrom, r.realTo] };
    const last = list.length - 1;
    const cf = Math.max(0, Math.min(last, r.from)), ct = Math.max(0, Math.min(last, r.to));
    return { nan: false, from: r.from, to: r.to, realFrom: r.realFrom, realTo: r.realTo, bars: r.to - r.from + 1,
      cf, ct, fromTs: list[cf] && list[cf].timestamp, toTs: list[ct] && list[ct].timestamp }; }
  catch (e) { return { nan: true, error: String(e.message) }; }
}
function reg(chart, period, isBase) { return { id: (isBase ? 'base:' : 'sat:') + period + ':' + Math.random().toString(36).slice(2, 6), chart, period, isBase }; }
function statsOf(g) { return JSON.parse(JSON.stringify(g.stats)); }
/** 按实测密度比校准：base 间距 = satBucket / D（同 design 夹具口径） */
function pair(basePeriod, density, satPeriod, satBucket, baseCount, satCount) {
  const baseSpacing = satBucket / density;
  const base = mkChart(series(baseCount, baseSpacing, T0), null, { span: 1, type: 'minute' });
  const sat = mkChart(series(satCount, satBucket, T0), WIDENED, { span: 1, type: 'minute' });
  return { base, sat, satBucket, baseSpacing };
}
const round = (v) => (isFinite(v) ? Math.round(v * 1000) / 1000 : v);

async function run() {
  log('klinecharts ' + R.version);

  // ── S0：引擎落点探针（请求索引 vs 实际右缘索引；索引定位的事实依据） ──
  {
    const bars = series(600, MIN, T0);
    const a = mkChart(bars, null, { span: 1, type: 'minute' });
    a.setBarSpace(8); await wait(150);
    a.setOffsetRightDistance(0); await wait(60);
    const landings = [];
    for (const k of [300, 302, 250]) {
      a.scrollToDataIndex(k); await wait(120);
      const r = rangeOf(a);
      landings.push({ requestedIndex: k, from: r.from, to: r.to, landedOffsetBars: r.to - k });
    }
    a.scrollToTimestamp(bars[300].timestamp); await wait(120);
    const rt = rangeOf(a);
    R.scenarios.S0_landing_probe = {
      offsetRightPx: a.getOffsetRightDistance(),
      scrollToDataIndex: landings,
      scrollToTimestamp_300: { from: rt.from, to: rt.to, toTsMinusTarget: rt.toTs - bars[300].timestamp },
    };
  }

  // ── S1：1m↔1m 20 轮镜像漂移 ──
  {
    const bars = series(600, MIN, T0);
    const base = mkChart(bars, null, { span: 1, type: 'minute' });
    const sat = mkChart(bars, null, { span: 1, type: 'minute' });
    const g = new ChartSyncGroup([reg(base, '1m', true), reg(sat, '1m', false)]);
    g.start(); await wait(120);
    const rows = []; let maxDrift = 0;
    for (let r = 0; r < 20; r++) {
      base.scrollToDataIndex(300 + r * 5); await wait(120);
      const rb = rangeOf(base), rs = rangeOf(sat);
      const d = Math.max(Math.abs(rs.from - rb.from), Math.abs(rs.to - rb.to));
      if (d > maxDrift) maxDrift = d;
      rows.push({ round: r + 1, base: [rb.from, rb.to], sat: [rs.from, rs.to], drift: d });
    }
    R.scenarios.S1_g1_nodrift = {
      rounds: 20, maxDrift, driftSeries: rows.map((r) => r.drift),
      samples: rows.filter((r, i) => i < 3 || r.drift !== 0),
      baseOffsetPx: base.getOffsetRightDistance(), satOffsetPx: sat.getOffsetRightDistance(),
      stats: statsOf(g),
      pass: maxDrift <= 1 && g.stats.suppressed > 0 && g.stats.echoEvents === 0,
    };
    g.stop();
  }

  // ── S2：跨周期三组合（跨度差 + 右端差，单位 = 高周期 bar） ──
  {
    const combos = [
      ['1m↔5m', '1m', 4.7, '5m', 5 * MIN, 4000, 800, 2000],
      ['1m↔15m', '1m', 12.2, '15m', 15 * MIN, 6000, 600, 3000],
      ['1d↔1w', '1d', 4.67, '1w', WEEK, 600, 120, 300],
    ];
    const out = {};
    for (const [name, bp, dens, sp, sbucket, bc, sc, mid] of combos) {
      const p = pair(bp, dens, sp, sbucket, bc, sc);
      const g = new ChartSyncGroup([reg(p.base, bp, true), reg(p.sat, sp, false)]);
      g.start(); p.base.setBarSpace(8); await wait(200);
      p.base.scrollToDataIndex(mid); await wait(350);
      const rb = rangeOf(p.base), rs = rangeOf(p.sat);
      const spanB = rb.nan ? NaN : (rb.toTs - rb.fromTs) + MIN;
      const spanS = rs.nan ? NaN : (rs.toTs - rs.fromTs) + sbucket;
      const spanDiff = Math.abs(spanS - spanB), edgeDiff = Math.abs(rs.toTs - rb.toTs);
      out[name] = {
        baseBS: bsOf(p.base), satBS: bsOf(p.sat), expectedSatBS: Math.round(8 * dens),
        baseWindow: [rb.from, rb.to], satWindow: [rs.from, rs.to], satBars: rs.bars,
        spanDiffMs: round(spanDiff), spanDiffBars: round(spanDiff / sbucket),
        edgeDiffMs: round(edgeDiff), edgeDiffBars: round(edgeDiff / sbucket),
        toleranceMs: sbucket,
        spansPass: spanDiff <= sbucket, barsPass: rs.bars >= 2, edgePass: edgeDiff <= sbucket,
        degraded: g.stats.degraded, degradedPeriod: g.stats.degradedPeriod,
        unaligned: g.stats.unalignedFollowers, iterations: g.stats.lastCorrectionIterations,
        spanResidualBars: round(g.stats.spanResidualBars), edgeResidualBars: round(g.stats.edgeResidualBars), barSpaceAdjust: g.stats.barSpaceAdjust, adjustVsIdealBS: bsOf(p.sat) - Math.round(8 * dens),
        suppressed: g.stats.suppressed, echo: g.stats.echoEvents,
      };
      out[name].pass = out[name].spansPass && out[name].barsPass && out[name].edgePass;
      g.stop();
    }
    R.scenarios.S2_cross_period = out;
  }

  // ── S4：T8bis 降级路径（1m↔1h；baseBS=8 ⇒ 理想 302 > 260） ──
  {
    const p = pair('1m', 37.8, '1h', 60 * MIN, 8000, 300);
    const g = new ChartSyncGroup([reg(p.base, '1m', true), reg(p.sat, '1h', false)]);
    const snaps = []; g.onChange((st) => snaps.push(st));
    g.start(); p.base.setBarSpace(8); await wait(200);
    p.base.scrollToDataIndex(4000); await wait(350);
    const rb = rangeOf(p.base), rs = rangeOf(p.sat);
    const spanDiff = Math.abs(((rs.toTs - rs.fromTs) + 60 * MIN) - ((rb.toTs - rb.fromTs) + MIN));
    const edgeDiff = Math.abs(rs.toTs - rb.toTs);
    const out = {
      ideal: Math.round(8 * 37.8), satBS: bsOf(p.sat), capacity: Math.floor(p.sat.getSize().width / 2),
      satBars: rs.bars, degraded: g.stats.degraded, degradedPeriod: g.stats.degradedPeriod,
      lastSpanDiffMinutes: g.stats.lastSpanDiffMinutes, iterations: g.stats.lastCorrectionIterations,
      spanDiffMs: round(spanDiff), spanDiffBars: round(spanDiff / (60 * MIN)),
      edgeDiffMs: round(edgeDiff), edgeDiffBars: round(edgeDiff / (60 * MIN)), toleranceMs: 60 * MIN,
      spansPass: spanDiff <= 60 * MIN, edgePass: edgeDiff <= 60 * MIN,
      snapshots: snaps.length, lastSnapshotDegraded: snaps.length ? snaps[snaps.length - 1].degraded : null,
    };
    out.pass = out.satBS === out.capacity && out.satBars >= 2 && out.degraded === true && out.degradedPeriod === '1h' && out.spansPass && out.edgePass && out.snapshots > 0;
    p.base.setBarSpace(4); await wait(350);
    const nb = rangeOf(p.base), ns = rangeOf(p.sat);
    const shrinkSpan = Math.abs(((ns.toTs - ns.fromTs) + 60 * MIN) - ((nb.toTs - nb.fromTs) + MIN));
    const shrinkEdge = Math.abs(ns.toTs - nb.toTs);
    out.shrink = {
      satBS: bsOf(p.sat), expected: Math.round(4 * 37.8), degraded: g.stats.degraded, degradedPeriod: g.stats.degradedPeriod,
      satBars: ns.bars, iterations: g.stats.lastCorrectionIterations, unaligned: g.stats.unalignedFollowers,
      spanDiffMs: round(shrinkSpan), spanDiffBars: round(shrinkSpan / (60 * MIN)),
      edgeDiffMs: round(shrinkEdge), edgeDiffBars: round(shrinkEdge / (60 * MIN)),
      spansPass: shrinkSpan <= 60 * MIN, edgePass: shrinkEdge <= 60 * MIN,
      lastSnapshotDegraded: snaps.length ? snaps[snaps.length - 1].degraded : null,
    };
    out.shrink.pass = out.shrink.degraded === false && out.shrink.satBars >= 2 && out.shrink.spansPass && out.shrink.edgePass;
    out.pass = out.pass && out.shrink.pass;
    R.scenarios.S4_t8bis = out;
    g.stop();
  }

  // ── S6：【硬约束】基准永不作为 follower（卫星做 leader ⇒ 基准逐字段不变；卫星↔卫星照常对齐） ──
  {
    const p = pair('1d', 4.67, '1w', WEEK, 600, 120);
    const g = new ChartSyncGroup([reg(p.base, '1d', true), reg(p.sat, '1w', false)]);
    g.start(); await wait(150);
    const baseBsBefore = bsOf(p.base), baseRangeBefore = JSON.stringify(rangeOf(p.base)), baseOffsetBefore = p.base.getOffsetRightDistance();
    p.sat.setBarSpace(300); await wait(150);
    p.sat.scrollToDataIndex(60); await wait(350);
    const baseRangeAfter = JSON.stringify(rangeOf(p.base));
    R.scenarios.S6_base_never_follower = {
      baseBsBefore, baseBsAfter: bsOf(p.base), baseBsUnchanged: bsOf(p.base) === baseBsBefore,
      baseRangeUnchanged: baseRangeAfter === baseRangeBefore,
      baseOffsetUnchanged: p.base.getOffsetRightDistance() === baseOffsetBefore,
      wouldNaiveWrite: Math.round(bsOf(p.sat) / 4.67),
      note: '若实现错误地把基准当 follower：推导 round(300/4.67)=64 > 基准上限 50 ⇒ 基准会被改写 ⇒ baseBsUnchanged/baseRangeUnchanged 必红',
      stats: statsOf(g),
      pass: bsOf(p.base) === baseBsBefore && baseRangeAfter === baseRangeBefore && g.stats.echoEvents === 0,
    };
    g.stop();
    // 卫星↔卫星（P3-C S6 同构）：15m leader ⇒ 1h follower 对齐；基准（1m）保持不动
    const base = mkChart(series(8000, 15 * MIN / 12.2, T0), null, { span: 1, type: 'minute' });
    const s15 = mkChart(series(600, 15 * MIN, T0), WIDENED, { span: 1, type: 'minute' });
    const s1h = mkChart(series(300, 60 * MIN, T0), WIDENED, { span: 1, type: 'minute' });
    const g2 = new ChartSyncGroup([reg(base, '1m', true), reg(s15, '15m', false), reg(s1h, '1h', false)]);
    g2.start(); await wait(200);
    const bBs = bsOf(base), bRange = JSON.stringify(rangeOf(base)), bOff = base.getOffsetRightDistance();
    s15.setBarSpace(8); await wait(250);
    s15.scrollToDataIndex(300); await wait(400);
    const r15 = rangeOf(s15), r1h = rangeOf(s1h);
    const span15 = (r15.toTs - r15.fromTs) + 15 * MIN, span1h = (r1h.toTs - r1h.fromTs) + 60 * MIN;
    R.scenarios.S6_sat_to_sat = {
      bs15: bsOf(s15), bs1h: bsOf(s1h), expected1h: Math.round(bsOf(s15) * (37.8 / 12.2)),
      baseBs: bsOf(base), baseBsUnchanged: bsOf(base) === bBs,
      baseRangeUnchanged: JSON.stringify(rangeOf(base)) === bRange, baseOffsetUnchanged: base.getOffsetRightDistance() === bOff,
      spanDiffBars1h: round(Math.abs(span1h - span15) / (60 * MIN)),
      edgeDiffBars1h: round(Math.abs(r1h.toTs - r15.toTs) / (60 * MIN)),
      unaligned: g2.stats.unalignedFollowers, degraded: g2.stats.degraded, degradedPeriod: g2.stats.degradedPeriod,
      echos: g2.stats.echoEvents, iterations: g2.stats.lastCorrectionIterations,
      spanResidualBars: round(g2.stats.spanResidualBars), edgeResidualBars: round(g2.stats.edgeResidualBars),
      barSpaceAdjust: g2.stats.barSpaceAdjust,
      pass: bsOf(base) === bBs && g2.stats.degraded === false && g2.stats.unalignedFollowers === 0,
    };
    g2.stop();
  }

  // ── S8：降级路径 = fail-closed + 实测可达下界记录（1m↔1h @ baseBS=8，容量 260） ──
  {
    const p = pair('1m', 37.8, '1h', 60 * MIN, 8000, 300);
    const g = new ChartSyncGroup([reg(p.base, '1m', true), reg(p.sat, '1h', false)]);
    g.start(); p.base.setBarSpace(8); await wait(200);
    p.base.scrollToDataIndex(4000); await wait(350);
    R.scenarios.S8_degraded_lower_bound = {
      satBS: bsOf(p.sat), satBars: rangeOf(p.sat).bars,
      degraded: g.stats.degraded, degradedPeriod: g.stats.degradedPeriod,
      unalignedFollowers: g.stats.unalignedFollowers, lastUnalignedReason: g.stats.lastUnalignedReason,
      iterations: g.stats.lastCorrectionIterations,
      spanResidualBars_recorded: round(g.stats.spanResidualBars), edgeResidualBars_recorded: round(g.stats.edgeResidualBars),
      barSpaceAdjust: g.stats.barSpaceAdjust, lastSpanDiffMinutes: g.stats.lastSpanDiffMinutes,
      note: '降级路径判据 = 可见 ≥2 根 + 右端差 ≤1 根 + degraded/degradedPeriod + 角标/统计可读 + 可达下界记录；跨度差 ≤1 根在本组合不可达（见 S7）',
      pass: g.stats.degraded === true && g.stats.degradedPeriod === '1h' && rangeOf(p.sat).bars >= 2
        && g.stats.edgeResidualBars <= 1 && g.stats.spanResidualBars > 1,
    };
    g.stop();
  }

  // ── S7：最小区分/可达精度探针（引擎夹取 + 部分 bar 计数 ⇒ 「≤1 根」是否可达） ──
  {
    const out = {};
    // (a) 1h 跟随者：增大 barSpace 是否能减少「可见根数」？（退化路径只允 ≤floor(width/2)=260）
    {
      const sat = mkChart(series(300, 60 * MIN, T0), WIDENED, { span: 1, type: 'minute' });
      sat.setOffsetRightDistance(0); await wait(60);
      sat.scrollToDataIndex(150); await wait(120);
      const rows = [];
      for (const bs of [151, 200, 260, 300, 400, 520, 1000, 5000]) {
        sat.setBarSpace(bs); await wait(180);
        const r = rangeOf(sat);
        rows.push({ requested: bs, readbackBS: bsOf(sat), bars: r.bars, from: r.from, to: r.to, spanMs: (r.toTs - r.fromTs) + 60 * MIN });
      }
      out.follower1h_barsVsBarSpace = rows;
      out.engineClampPxPerBar = Math.floor(sat.getSize().width / 2);
    }
    // (b) 1d 跟随者（base 作为 follower）：目标 ~28 根可达性
    {
      const b = mkChart(series(600, DAY, T0), null, { span: 1, type: 'minute' });
      b.setOffsetRightDistance(0); await wait(60);
      b.scrollToDataIndex(300); await wait(120);
      const rows = [];
      for (const bs of [16, 17, 18, 19, 20, 21, 50]) {
        b.setBarSpace(bs); await wait(180);
        const r = rangeOf(b);
        rows.push({ bs, bars: r.bars, spanBars: r.bars, from: r.from, to: r.to });
      }
      out.follower1d_barsVsBarSpace = rows;
    }
    R.scenarios.S7_reachability_probe = out;
  }

  R.ok = R.errors.length === 0;
  window.__RESULT = R;
  window.__DONE = true;
}
run().catch((e) => { err(e); R.ok = false; window.__RESULT = R; window.__DONE = true; });
</script>
</body>
</html>
