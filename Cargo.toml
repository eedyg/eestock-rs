# eestock-rs workspace 骨架（手写例外，ADR-007：本文件不 tangle）
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# 统一依赖版本：各 crate 一律用 `<dep>.workspace = true` 引用，禁止自行指定版本。
[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# Web 框架（web crate 使用）
axum = "0.8"
# TimescaleDB 访问（storage crate 使用）：postgres + chrono(timestamptz) + migrate；
# tls 走 rustls，避免系统 openssl 依赖
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "migrate",
    # Phase 3a 回测：backtest_runs/backtest_results 用 jsonb 列，需 sqlx 支持 serde_json::Value
    # （web/domain 已用 serde_json，无新增外部 crate；本 feature 仅解锁 jsonb 类型映射）
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
# HTTP 客户端（tushare crate 使用，父级裁决批准引入；rustls 与 sqlx tls-rustls 一致）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
# GBK 解码（providers：腾讯 qt / 新浪 hq 快照响应；父级裁决 2026-09-03 批准）
encoding_rs = "0.8"
# TOML 配置（app：数据面配置文件；父级裁决 2026-09-03 批准）
toml = "0.8"
# SSE 流包装（mcp：ReceiverStream/IntervalStream；父级裁决 2026-09-04 批准——
# 锁文件零变化：sqlx 传递依赖已在树内；决策注记见 design/07-app-plane/01-mcp.md §0）
tokio-stream = { version = "0.1", features = ["sync"] }
# QuickJS 沙箱绑定（strategy-runtime 插件运行时；父级裁决 2026-09-08 批准，ADR 12-strategy-system D1）。
# 版本选型：锁 0.11 —— 0.12+ 的 MSRV 为 rust 1.87，超出 workspace rust-version = 1.85；
# 0.11（MSRV 1.85）是兼容本 workspace 的最新稳定版。default-features 关闭，仅留 std（纯逻辑 crate 最小面）。
# 禁忌（评审 NIT-5 裁决）：禁止为 rquickjs 启用 rust-alloc/allocator feature
# （会使 set_memory_limit 静默失效，G2 内存上限形同虚设）。
rquickjs = { version = "0.11", default-features = false, features = ["std"] }
# sha256 哈希寻址（strategy Registry 发布版本 sha256，ABI G4；架构裁决 2026-09-09 批准，
# 纯 Rust 实现无系统依赖；application 层 StrategyService 发布门禁/播种使用）。
sha2 = "0.10"
