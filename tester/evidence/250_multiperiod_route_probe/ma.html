<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#101418}#m{width:600px;height:400px}</style></head>
<body><div id="m"></div><script src="../../../web/node_modules/klinecharts/dist/umd/klinecharts.min.js"></script>
<script>(function(){const kc=window.klinecharts;const T0=Date.parse('2026-09-14T00:00:00Z');const bars=[];let px=8.9;for(let i=0;i<300;i++){const ts=T0+i*60000;px+=Math.sin(i/13)*0.002;const o=+px.toFixed(4),c=+(px+Math.sin(i/7)*0.001).toFixed(4);bars.push({timestamp:ts,open:o,high:+(Math.max(o,c)+0.0008).toFixed(4),low:+(Math.min(o,c)-0.0008).toFixed(4),close:c,volume:100});}
const ch=kc.init('m',{styles:'dark'});ch.setSymbol({ticker:'518880',pricePrecision:4,volumePrecision:0});ch.setPeriod({span:1,type:'minute'});ch.setDataLoader({getBars:({callback})=>callback(bars,false),subscribe(){},unsubscribe(){}});
setTimeout(()=>{const R={};R.retMA_noPane=ch.createIndicator({name:'MA',calcParams:[5,10,30]});R.retMA_onCandle=ch.createIndicator({name:'MA',calcParams:[5,10,30],paneId:'candle_pane'});R.retEMA_noPane=ch.createIndicator({name:'EMA',calcParams:[12]});setTimeout(()=>{R.after=ch.getIndicators().map(i=>({name:i.name,paneId:i.paneId,visible:i.visible,calcParams:i.calcParams}));R.panes=ch.getPaneOptions().map(p=>p.id);window.__RESULT=R;window.__DONE=true;},300);},100);})();</script></body></html>
