<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>P2-A 卫星实例 · 真身 klinecharts 库事实取证（T2 / G4 前置）</title>
<style>
  html, body { margin: 0; padding: 0; background: #101418; color: #c9d1d9; font: 12px/1.5 monospace; }
  #wrap { display: flex; gap: 12px; padding: 8px; }
  #chart { width: 900px; height: 520px; background: #101418; }
  #log { white-space: pre-wrap; width: 520px; }
</style>
</head>
<body>
<!--
  P2-A 卫星实例：**真身 klinecharts 10.0.3** 库事实取证（本地 file:// + UMD，0 网络请求）。

  依据 `design/15-multi-period/02-spec.md` §3.4（隐藏 K 线唯一可行手段）+ §8（禁用图表导出）
  + `03-test-plan.md` T2（含「height:0 单独无效」的库事实回归）与 G4（像素取证禁用 getConvertPictureUrl）。

  用法（须在 `web/` 下运行以解析 playwright）：
      node tester/p2-satellite-harness/run.mjs
-->
<div id="wrap">
  <div id="chart"></div>
  <div id="log"></div>
</div>
<script src="../../node_modules/klinecharts/dist/umd/klinecharts.min.js"></script>
<script>
(function () {
  var kc = window.klinecharts;
  var R = { steps: {}, errors: [], console: [] };
  var log = function (s) { document.getElementById('log').textContent += s + '\n'; };

  // ── 合成 1m 序列（确定性；仅驱动引擎行为，与后端 ts 口径无关）──
  var T0 = Date.UTC(2026, 8, 14, 1, 30, 0);
  var bars = [];
  var px = 8.9;
  for (var i = 0; i < 300; i++) {
    px += Math.sin(i / 13) * 0.002 + Math.cos(i / 29) * 0.001;
    var o = +px.toFixed(4), c = +(px + Math.sin(i / 7) * 0.001).toFixed(4);
    bars.push({
      timestamp: T0 + i * 60000,
      open: o, high: +(Math.max(o, c) + 0.0008).toFixed(4),
      low: +(Math.min(o, c) - 0.0008).toFixed(4), close: c, volume: 100,
    });
  }

  // ── 自研指标（形状对齐 DCAP：3 条数据线 + 1 条常驻 0 参考线；precision 5）──
  kc.registerIndicator({
    name: 'P2SAT', shortName: 'P2SAT', precision: 5,
    calcParams: [3, 5, 8],
    figures: [
      { key: 's', title: 'S: ', type: 'line' },
      { key: 'm', title: 'M: ', type: 'line' },
      { key: 'l', title: 'L: ', type: 'line' },
      { key: 'zero', title: '0: ', type: 'line', styles: function () { return { color: '#6b7280', size: 1, style: 'dashed' }; } },
    ],
    calc: function (dataList, indicator) {
      return dataList.map(function (d, n) {
        var ok = n >= 7;
        return { s: ok ? d.close : null, m: ok ? d.close * 0.9 : null, l: ok ? d.close * 0.8 : null, zero: 0 };
      });
    },
  });

  var err = function (e) { R.errors.push(String(e && e.message ? e.message : e)); };

  var chart = kc.init(document.getElementById('chart'), { styles: 'dark' });
  var candlePane = 'candle_pane';
  var indPane = null;

  var rectOf = function (id) {
    try {
      var el = chart.getDom(id);
      if (!el) return null;
      var r = el.getBoundingClientRect();
      return { top: +r.top.toFixed(2), bottom: +r.bottom.toFixed(2), height: +r.height.toFixed(2), width: +r.width.toFixed(2) };
    } catch (e) { err(e); return null; }
  };
  var paneSummary = function () {
    return chart.getPaneOptions().map(function (p) {
      return { id: p.id, height: p.height, minHeight: p.minHeight, state: p.state };
    });
  };
  var gapOf = function (a, b) {
    var ra = rectOf(a), rb = rectOf(b);
    return (ra && rb) ? +(rb.top - ra.bottom).toFixed(2) : null;
  };
  /** 全局画布 fillText 打点（探针 165 手法）：证明指标确实被**绘制**（G4 像素取证的前置）。 */
  var texts = [];
  (function patchFillText() {
    var proto = window.CanvasRenderingContext2D && window.CanvasRenderingContext2D.prototype;
    if (!proto || !proto.fillText) return;
    var orig = proto.fillText;
    proto.fillText = function (t) { texts.push(String(t)); return orig.apply(this, arguments); };
  })();

  /** 引擎用 rAF 重排/重绘；变更后必须等一帧以上再量（探针 165 教训：过早读取得空值）。 */
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms || 350); }); };

  (async function run() {
    chart.setSymbol({ ticker: '518880', pricePrecision: 4, volumePrecision: 0 });
    chart.setPeriod({ span: 1, type: 'minute' });
    chart.setDataLoader({ getBars: function (a) { a.callback(bars, false); }, subscribe: function () {}, unsubscribe: function () {} });
    chart.resetData();

    await wait();
    R.steps.S0_baseline = { panes: paneSummary(), rectCandle: rectOf(candlePane) };

    // 指标 pane（卫星要保留的那一个）
    var ret = chart.createIndicator({ name: 'P2SAT', calcParams: [3, 5, 8] }, true);
    indPane = (chart.getIndicators({ name: 'P2SAT' })[0] || {}).paneId || null;
    await wait();
    R.steps.S1_indicator_pane = {
      createReturn: ret, indicatorPaneId: indPane, panes: paneSummary(),
      rectInd: rectOf(indPane), rectCandle: rectOf(candlePane),
    };

    // ── L1（库事实回归）：单独 height:0 —— 期望**高度不变**（被静默忽略）──
    var beforeHeight0 = rectOf(candlePane);
    chart.setPaneOptions({ id: candlePane, height: 0 });
    await wait();
    var afterHeight0 = rectOf(candlePane);
    R.steps.S2_height0_alone = {
      paneOpt: chart.getPaneOptions(candlePane),
      rectCandleBefore: beforeHeight0, rectCandleAfter: afterHeight0,
      /** FACT：height:0 被忽略（index.esm.js:15421 `options.height > 0` 守卫）⇒ 单独使用无效 */
      heightUnchanged: !!(beforeHeight0 && afterHeight0 && Math.abs(afterHeight0.height - beforeHeight0.height) < 0.5),
      heightIsZero: !!(afterHeight0 && afterHeight0.height === 0),
    };

    // ── L2：唯一可行手段 state:'minimize' + minHeight:0 ──
    chart.setPaneOptions({ id: candlePane, state: 'minimize', minHeight: 0 });
    await wait();
    var rc3 = rectOf(candlePane), ri3 = rectOf(indPane);
    R.steps.S3_minimize = {
      panes: paneSummary(), rectCandle: rc3, rectInd: ri3,
      candleHeightIsZero: !!(rc3 && rc3.height === 0),
      /** 指标 pane 填满实例容器（画布高 520 − x 轴 ≈ 剩余全部） */
      indFillsContainer: !!(ri3 && ri3.height >= 520 * 0.8),
    };

    // ── L3：separator.size=0 消除零高 pane 的残留间隙 ──
    chart.setStyles({ separator: { size: 0 } });
    await wait();
    R.steps.S4_separator0 = {
      gapPx: gapOf(candlePane, indPane), rectCandle: rectOf(candlePane), rectInd: rectOf(indPane),
    };

    // ── L4：缩放 + 滚动后仍然成立 ──
    chart.setBarSpace(30);
    chart.scrollToDataIndex(120);
    await wait();
    var rc5 = rectOf(candlePane), ri5 = rectOf(indPane);
    var gap5 = gapOf(candlePane, indPane);
    R.steps.S5_zoom_scroll = {
      panes: paneSummary(), rectCandle: rc5, rectInd: ri5, gapPx: gap5,
      candleHeightStillZero: !!(rc5 && rc5.height === 0),
      gapStillZero: gap5 === 0,
    };

    // ── L5（G4 前置）：零高 pane 存在时图表导出抛错 ⇒ **禁用 getConvertPictureUrl**，改页面截图 ──
    var out6 = { threw: false, name: null, message: null };
    try { chart.getConvertPictureUrl(true); } catch (e) { out6 = { threw: true, name: e.name, message: String(e.message).slice(0, 160) }; }
    R.steps.S6_export_throws = out6;
    await wait(120);

    // ── L6（G4 前置）：指标确实被绘制（画布 draw 打点阳性对照）──
    await wait();
    R.steps.S7_drawn_texts = {
      fillTextCount: texts.length,
      hasIndicatorLegend: texts.some(function (t) { return /^S: |^M: |^L: |P2SAT/.test(t); }),
      zeroLineLegend: texts.some(function (t) { return /^0: /.test(t); }),
      sample: texts.slice(-12),
    };

    // ── L7：可还原（state:'normal' ⇒ K 线回来；证明折叠是可逆的 UI 状态）──
    chart.setPaneOptions({ id: candlePane, state: 'normal', minHeight: 30 });
    await wait();
    var rc8 = rectOf(candlePane);
    R.steps.S8_restore_normal = { rectCandle: rc8, restored: !!(rc8 && rc8.height > 0) };

    R.version = (kc.version || (kc.getVersion && kc.getVersion()) || null);
    R.ua = navigator.userAgent;
    window.__RESULT = R;
    window.__DONE = true;
    log('DONE');
  })().catch(function (e) { err(e); window.__RESULT = R; window.__DONE = true; });
})();
</script>
</body>
</html>
