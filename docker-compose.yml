# eestock-rs 本地开发编排（手写工程基建，不 tangle）
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: eestock-timescaledb
    restart: unless-stopped
    ports:
      # 宿主机 5433，避免与本机既有 PostgreSQL(5432) 冲突
      - "5433:5432"
    environment:
      POSTGRES_USER: eestock
      POSTGRES_PASSWORD: eestock
      POSTGRES_DB: eestock
    volumes:
      - timescale_data:/var/lib/postgresql/data
      # migrations/*.sql 由 design/04-storage/schema.md tangle 生成；
      # 仅首次初始化空数据卷时按文件名顺序自动执行
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eestock -d eestock"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    # 占位：Wave 1 采集/Web 服务。build 上下文预留，默认不启动：
    #   docker compose --profile app up -d   # 显式启用
    build:
      context: .
      dockerfile: Dockerfile   # TODO(Wave 1)：多阶段 cargo build，尚未创建
    container_name: eestock-app
    profiles: ["app"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eestock:eestock@timescaledb:5432/eestock
      RUST_LOG: info
    ports:
      - "8080:8080"

volumes:
  timescale_data:
    name: eestock-timescale-data
