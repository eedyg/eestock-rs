# eestock-rs 本地开发编排（手写工程基建，不 tangle）
services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg16  # pin 版本（ADR：latest 滚动 tag 导致压缩语法漂移事故 2026-09-03）
    container_name: eestock-timescaledb
    restart: unless-stopped
    # EV-1：TimescaleDB 并行查询需共享内存；不设则容器默认 /dev/shm=64MB → 并发 kline 间歇 500
    #（"No space left on device"）。设 2g（compose v1 语法 shm_size: "2g"）；数据在 ./data/timescaledb 卷，重建安全。
    shm_size: "2g"
    # EV-1（续）：并发 kline 仍 500（out of shared memory）——根因是 PG 并行 worker 的 per-query
    # DSA 共享内存预算在 kline 并发下耗尽（kline 为 (code,ts) 索引点查，并行无益且正是 DSA 主体）。
    # 禁用并行 worker 消除 DSA 分配；dynamic_shared_memory_type=mmap（文件后备）兜底。
    command: ["postgres", "-c", "max_parallel_workers_per_gather=0", "-c", "dynamic_shared_memory_type=mmap", "-c", "max_locks_per_transaction=512"]
    ports:
      # 宿主机 5433，避免与本机既有 PostgreSQL(5432) 冲突
      - "5433:5432"
    environment:
      POSTGRES_USER: eestock
      POSTGRES_PASSWORD: eestock
      POSTGRES_DB: eestock
    volumes:
      # bind mount 到项目目录（用户裁决 2026-09-03：数据文件可见可控；已入 .gitignore）
      - ./data/timescaledb:/var/lib/postgresql/data
      # migrations/*.sql 由 design/04-storage/schema.md tangle 生成；
      # 仅首次初始化空数据卷时按文件名顺序自动执行
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eestock -d eestock"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # 数据面（ADR-017 基座）：采集 + 降级模式 + 缺口回填 + tushare 日增量 + /healthz
  data:
    build:
      context: .
      dockerfile: Dockerfile   # 多阶段构建（design/03-collector/02-data-plane.md tangle 生成）
    container_name: eestock-data
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eestock:eestock@timescaledb:5432/eestock
      # secret 经环境变量注入，不落配置文件（宿主机 export TUSHARE_TOKEN=...）
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      RUST_LOG: info
    volumes:
      # 本地配置文件（.gitignore；模板 config/data.toml.example 入库）
      - ./config/data.toml:/etc/eestock/data.toml:ro
    ports:
      - "8080:8080"   # 唯一端口：/healthz 只读存活探测
    healthcheck:
      # 运行时镜像无 curl/wget，用二进制自带子命令
      test: ["CMD", "/usr/local/bin/eestock-data", "--self-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 应用面（ADR-017，Wave 1 Phase A）：web REST/WS + diagnose 读库 + SPA 托管
  # 与数据面零 API 直连，唯一耦合点 = timescaledb；不依赖 data 服务（故障隔离）
  app:
    build:
      context: .
      dockerfile: Dockerfile.app   # design/07-app-plane/00-web-api.md tangle 生成
    container_name: eestock-app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eestock:eestock@timescaledb:5432/eestock
      RUST_LOG: info
    volumes:
      # 本地配置文件（.gitignore；模板 config/app.toml.example 入库）
      - ./config/app.toml:/etc/eestock/app.toml:ro
    ports:
      - "8081:8081"   # 应用面 REST/WS/SPA（数据面 8080 不动）
      - "8082:8082"   # MCP HTTP/SSE（Wave 1 Phase D，ADR-009；免认证内网 ADR-010，仅局域网）
    healthcheck:
      # 复用二进制自带 --self-check（GET /healthz，axum 路由）
      test: ["CMD", "/usr/local/bin/eestock-app", "--self-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

